<!doctype html>
<html lang="en">
<head>
<!--#include head -->
  <title>DSD Login | HELLA GOOD! Energy Gummies</title>
  <meta name="description" content="Log in to your HELLA GOOD! Energy Gummies DSD (distributor) portal.">
  {{ROBOTS}}
  <link rel="canonical" href="{{ORIGIN}}/login">
  <link rel="stylesheet" href="/css/dsd.css">
  <script src="/js/auth.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
<!--#include sprite -->
<!--#include dsd-header -->

  <main id="main" class="auth-main">
    <div class="wrap auth-wrap">
      <div class="brand-mark" aria-hidden="true"><span class="brand-hella">HELLA</span> <span class="brand-good">GOOD!</span></div>
      <div class="auth-card">
        <h1>DSD <em>Login</em></h1>
        <p class="sub">Log in to order HELLA GOOD! Energy Gummies at wholesale.</p>
        <form id="login-form" novalidate>
          <input type="hidden" id="next" value="{{NEXT}}">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required autofocus>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <div class="form-msg" id="login-msg" role="alert"></div>
          <button type="submit" class="btn btn-red btn-block btn-xl" id="login-btn">Log in</button>
        </form>
        <p class="auth-alt">Not a DSD yet? <a href="/apply">Apply here</a></p>
      </div>
    </div>
  </main>

<!--#include dsd-footer -->
</body>
</html>
