<!doctype html>
<html lang="en">
<head>
<!--#include head -->
  <title>Set up your DSD account | HELLA GOOD! Energy Gummies</title>
  <meta name="description" content="Finish setting up your HELLA GOOD! Energy Gummies DSD account.">
  {{ROBOTS}}
  <link rel="canonical" href="{{ORIGIN}}/invite">
  <link rel="stylesheet" href="/css/dsd.css">
  <script src="/js/auth.js" defer></script>
  <script src="/js/invite.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
<!--#include sprite -->
<!--#include dsd-header -->

  <main id="main" class="auth-main">
    <div class="wrap auth-wrap">
      <div class="brand-mark" aria-hidden="true"><span class="brand-hella">HELLA</span> <span class="brand-good">GOOD!</span></div>
      <div class="auth-card" id="invite-valid" style="display:none;">
        <h1>Set up your <em>account</em></h1>
        <p class="sub">Pick your name and password to finish setting up your DSD account.</p>
        <form id="invite-form" novalidate>
          <input type="hidden" id="invite-token" value="{{TOKEN}}">
          <div class="field">
            <label for="name">Your name</label>
            <input type="text" id="name" name="name" autocomplete="name" maxlength="120" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
            <p class="hint">At least 8 characters.</p>
          </div>
          <div class="form-msg" id="invite-msg" role="alert"></div>
          <button type="submit" class="btn btn-red btn-block btn-xl" id="invite-btn">Create account</button>
        </form>
      </div>
      <div class="auth-card" id="invite-invalid">
        <h1>Link <em>expired</em></h1>
        <p class="sub">That invite link is invalid or has already been used.</p>
        <a class="btn btn-red btn-block btn-xl" href="/login">Go to login</a>
      </div>
    </div>
  </main>

<!--#include dsd-footer -->
</body>
</html>
