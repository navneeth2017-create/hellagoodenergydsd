<!doctype html>
<html lang="en">
<head>
<!--#include head -->
  <title>DSD Portal | HELLA GOOD! Energy Gummies</title>
  <meta name="description" content="HELLA GOOD! Energy Gummies wholesale ordering for DSDs.">
  {{ROBOTS}}
  <link rel="canonical" href="{{ORIGIN}}/portal">
  <link rel="stylesheet" href="/css/dsd.css">
  <script src="/js/auth.js" defer></script>
  <script src="/js/pricing.js" defer></script>
  <script src="/js/portal.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
<!--#include sprite -->
<!--#include dsd-header -->

  <main id="main">
    <div class="wrap">
      <div class="portal-topbar">
        <h1>DSD <em>Portal</em></h1>
        <div class="portal-user">Signed in as <b id="portal-user-name">{{USER_NAME}}</b> A� <a href="#" data-logout>Sign out</a></div>
      </div>

      <div class="portal-save" id="portal-save" hidden></div>

      <!-- THE LINE UP: Display as hero, boxes as secondary -->
      <section class="line-up" aria-labelledby="lineup-title">
        <h2 id="lineup-title" class="lineup-heading">The Line Up</h2>
        
        <div class="lineup-hero" role="img" aria-label="HELLA GOOD! Energy Gummies display - three flavors in one display box">
          <div class="display-stage">
            <div class="display-aura" aria-hidden="true"></div>
            <picture class="display-img-wrap">
              <source type="image/avif" srcset="/images/display.avif">
              <img id="display-img" src="/images/display.webp" alt="HELLA GOOD! 3-flavor display box" width="720" height="720" fetchpriority="high">
            </picture>
          </div>
        </div>

        <p class="lineup-sub">One display = 3 boxes, one of each flavor (45 packs) · <b id="lineup-display-price">{{DISPLAY_PRICE}}</b></p>

        <div class="lineup-boxes" id="lineup-boxes" aria-label="Individual flavor boxes for reorders"></div>

        <button type="button" class="btn btn-red btn-xl" id="add-display">Add a full display</button>
      </section>

      <div class="portal-grid" id="portal-grid" aria-live="polite" hidden></div>

      <section class="cart-summary" id="cart-summary" aria-labelledby="cart-title">
        <h2 id="cart-title">Your order</h2>
        <div id="cart-body"></div>
      </section>

      <section class="orders" id="orders-section" aria-labelledby="orders-title">
        <h2 id="orders-title">My orders</h2>
        <div id="orders-list"></div>
      </section>
    </div>
  </main>

<!--#include dsd-footer -->
</body>
</html>
