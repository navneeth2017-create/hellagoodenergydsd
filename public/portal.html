<!doctype html>
<html lang="en">
<head>
<!--#include head -->
  <title>DSD Portal | HELLA GOOD! Energy Gummies</title>
  <meta name="description" content="HELLA GOOD! Energy Gummies wholesale ordering for DSDs.">
  {{ROBOTS}}
  <link rel="canonical" href="{{ORIGIN}}/portal">
  <link rel="stylesheet" href="/css/dsd.css">
  <script src="/js/auth.js" defer></script>
  <script src="/js/pricing.js" defer></script>
  <script src="/js/portal.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
<!--#include sprite -->
<!--#include dsd-header -->

  <main id="main">
    <div class="wrap">
      <header class="portal-topbar" style="justify-content:center;text-align:center;gap:16px;padding:clamp(20px, 4vw, 32px) 0;">
        <h1 style="font-size:clamp(32px, 5vw, 48px);font-weight:900;margin:0;line-height:1.1;">DSD <em style="color:var(--red);">Portal</em></h1>
        <div class="portal-user" style="color:var(--muted);font-size:14px;">Signed in as <b id="portal-user-name">{{USER_NAME}}</b> A� <a href="#" data-logout style="color:var(--accent);">Sign out</a></div>
      </header>

      <div class="portal-save" id="portal-save" hidden></div>

      <!-- FLAVOR BOXES GRID -->
      <section class="line-up" aria-labelledby="lineup-title">
        <div class="lineup-boxes" id="lineup-boxes" aria-label="Individual flavor boxes for reorders" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(180px, 25vw, 240px),1fr));gap:clamp(16px, 3vw, 24px);padding:clamp(16px, 3vw, 24px) 0;"></div>
      </section>

      <section class="cart-summary" id="cart-summary" aria-labelledby="cart-title" style="margin-top:clamp(24px, 4vw, 32px);">
        <h2 id="cart-title" style="font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(20px, 3vw, 24px);margin:0 0 16px;">Your order</h2>
        <div id="cart-body"></div>
      </section>

      <section class="orders" id="orders-section" aria-labelledby="orders-title" style="margin-top:clamp(24px, 4vw, 32px);">
        <h2 id="orders-title" style="font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(20px, 3vw, 24px);margin:0 0 16px;">My orders</h2>
        <div id="orders-list"></div>
      </section>
    </div>
  </main>

<!--#include dsd-footer -->
</body>
</html>
