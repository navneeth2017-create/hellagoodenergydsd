<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>viewport harness</title>
<style>
  html, body { margin: 0; background: #222; font: 12px system-ui, sans-serif; color: #ccc; }
  .row { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  iframe { border: 0; background: #000; display: block; }
  #desk { width: 1440px; height: 900px; }
  #mob { width: 390px; height: 844px; }
</style>
</head>
<body>
<div class="row">
  <div class="col"><span class="lbl">Desktop 1440 &times; 900</span><iframe id="desk" src="http://127.0.0.1:4321/"></iframe></div>
  <div class="col"><span class="lbl">Phone 390 &times; 844</span><iframe id="mob" src="http://127.0.0.1:4321/"></iframe></div>
</div>
</body>
</html>
