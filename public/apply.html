<!doctype html>
<html lang="en">
<head>
<!--#include head -->
  <title>Apply to be a DSD | HELLA GOOD! Energy Gummies</title>
  <meta name="description" content="Apply to become a HELLA GOOD! Energy Gummies DSD (distributor) and buy at wholesale.">
  {{ROBOTS}}
  <link rel="canonical" href="{{ORIGIN}}/apply">
  <link rel="stylesheet" href="/css/dsd.css">
  <script src="/js/auth.js" defer></script>
  <script src="/js/apply.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
<!--#include sprite -->
<!--#include dsd-header -->

  <main id="main" class="auth-main">
    <div class="wrap auth-wrap">
      <div class="brand-mark" aria-hidden="true"><span class="brand-hella">HELLA</span> <span class="brand-good">GOOD!</span></div>
      <div class="auth-card">
        <h1>Become a <em>DSD</em></h1>
        <p class="sub">Tell us who you are. We review each application and email you when your account is approved.</p>
        <form id="apply-form" novalidate>
          <div class="field">
            <label for="name">Your name</label>
            <input type="text" id="name" name="name" autocomplete="name" maxlength="120" required>
          </div>
          <div class="field">
            <label for="company">Company <span class="hint" style="display:inline;margin:0;">(optional)</span></label>
            <input type="text" id="company" name="company" autocomplete="organization" maxlength="120">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="phone">Phone <span class="hint" style="display:inline;margin:0;">(optional)</span></label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" maxlength="40">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
            <p class="hint">At least 8 characters.</p>
          </div>
          <div class="form-msg" id="apply-msg" role="alert"></div>
          <button type="submit" class="btn btn-red btn-block btn-xl" id="apply-btn">Submit application</button>
        </form>
        <p class="auth-alt">Already a DSD? <a href="/login">Log in</a></p>
      </div>
    </div>
  </main>

<!--#include dsd-footer -->
</body>
</html>
